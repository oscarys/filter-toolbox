name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-syntax:
    name: Lint & syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: Syntax check (pyflakes)
        run: |
          pyflakes filter_design.py
          pyflakes mainwindow.py
          pyflakes main.py
          pyflakes resources/i18n.py
          pyflakes resources/styles.py

      - name: Validate i18n completeness
        run: |
          python - << 'EOF'
          from resources.i18n import STRINGS
          en_keys = set(STRINGS["en"].keys())
          for lang, strings in STRINGS.items():
              if lang == "en":
                  continue
              missing = en_keys - set(strings.keys())
              if missing:
                  print(f"WARNING: '{lang}' is missing keys: {sorted(missing)}")
              else:
                  print(f"OK: '{lang}' has all {len(strings)} keys")
          EOF

      - name: Validate .ui files are well-formed XML
        run: |
          python - << 'EOF'
          import xml.etree.ElementTree as ET, glob, sys
          errors = []
          for path in glob.glob("*.ui"):
              try:
                  ET.parse(path)
                  print(f"OK: {path}")
              except ET.ParseError as e:
                  errors.append(f"FAIL: {path} — {e}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          EOF
